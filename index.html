<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iridium - Science Olympiad Timelines</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <h1 class="title">Iridium - Science Olympiad Timelines</h1>
    <section class="upload-panel card">
      <label class="dropzone" id="dropzone" for="file-input">
        <input id="file-input" type="file" multiple accept=".yaml,.yml,.json,.txt" />
        <span class="dropzone-title">Choose SciolyFF files</span>
        <span class="dropzone-subtitle">or drag files here</span>
      </label>

      <div class="upload-meta">
        <div>
          <span class="meta-label">Loaded files</span>
          <ul id="file-list" class="uploaded-files" aria-live="polite"></ul>
        </div>
        <div>
          <span class="meta-label">Status</span>
          <strong id="status-text">Waiting for upload</strong>
        </div>
      </div>
    </section>

    <section class="card controls">
      <div class="section-heading">
        <h2>Display options</h2>
        <p>Show or hide extra information in each tournament table.</p>
      </div>

      <div class="options-group">
        <h3 class="options-group-title">Team format options</h3>
        <div class="control-grid">
          <label><input type="checkbox" id="toggle-city" /> Show team city</label>
          <label><input type="checkbox" id="toggle-suffix" checked /> Show team suffix</label>
          <label><input type="checkbox" id="toggle-state" /> Show team state</label>
          <label><input type="checkbox" id="toggle-number" /> Show team number</label>
          <label><input type="checkbox" id="toggle-advanced" checked /> Show advancing teams</label>
          <label><input type="checkbox" id="toggle-top3" checked /> Highlight top ranks</label>
          <label class="text-input-label" for="highlight-count-max">
            Number of highlighted ranks
            <input id="highlight-count-max" type="number" min="1" max="10" step="1" value="3" />
          </label>
          <label class="text-input-label" for="team-name-max">
            Team name character limit
            <input id="team-name-max" type="number" min="1" max="1000" step="1" value="20" />
          </label>
          <label class="text-input-label" for="teams-shown-max">
            Number of teams shown
            <input id="teams-shown-max" type="number" min="1" max="1000" step="1" value="10" />
          </label>
        </div>
      </div>

      <div class="options-group">
        <h3 class="options-group-title">Tournament info options</h3>
        <div class="control-grid">
          <label><input type="checkbox" id="toggle-location" checked /> Show tournament location</label>
          <label><input type="checkbox" id="toggle-date" checked /> Show tournament date</label>
          <label><input type="checkbox" id="toggle-division" checked /> Show tournament division</label>
          <label><input type="checkbox" id="toggle-level" checked /> Show tournament level</label>
        </div>
      </div>
    </section>

    <section id="export-section" class="card export-section">
      <button id="export-button" class="export-button" type="button">Copy Table as PNG</button>
      <button id="download-button" class="export-button" type="button">Download Table as PNG</button>
      <button id="download-svg-button" class="export-button" type="button">Download Table as SVG</button>
    </section>

    <section id="tables" class="tables" aria-live="polite"></section>
  </main>

  <template id="tournament-template">
    <article class="tournament card">
      <div class="tournament-header">
        <div>
          <h2 class="tournament-title"></h2>
          <p class="tournament-meta"></p>
        </div>
      </div>

      <div class="results-classic-wrapper">
        <table class="results-classic">
          <colgroup>
            <col class="col-team" />
            <col class="col-rank" />
            <col class="col-points" />
          </colgroup>
          <thead>
            <tr>
              <th class="team">Team Name</th>
              <th class="rank">Rank</th>
              <th class="total-points">Total Points</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
